[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayan-midi-emulator"
version = "0.1.0"
description = "Minimal Bayan MIDI emulator"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Developer"},
]
dependencies = [
    "mido",
    "python-rtmidi",
    "PySide6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-qt",
]

[project.gui-scripts]
bayan-midi-emulator = "bayan_emulator.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bayan_emulator*"]
